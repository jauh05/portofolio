# Server block untuk media Kauiz. Pasang di /etc/nginx/sites-available lalu aktifkan lewat sites-enabled.
# HTTPS dihentikan di Cloudflare (tunnel), jadi nginx cukup mendengar di port 80.
# root harus sama dengan KAUIZ_PUBLIC_DIR di worker.env. Worker menyalin gambar langsung ke folder ini.
server {
    listen 80;
    server_name kauiz-media.jauharfauzi.my.id;

    root /var/www/kauiz-media;
    autoindex off;

    # Hanya file JPG hasil worker yang dilayani. Selain itu 404.
    location ~* \.jpg$ {
        default_type image/jpeg;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
